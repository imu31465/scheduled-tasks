name: pandra-ci

# Mirror CI for the private Pandra repository (same suites as the
# private .github/workflows/ci.yml, both OS).  Public runners are free
# and unlimited, so the private repo's Actions minutes stay at zero.
#
# How it works:
#   detect: ls-remote Pandra (read-only deploy key, no token) and pick
#           untested SHAs — the main tip plus the heads of open
#           same-repo PRs (refs/pull/N/merge only exists while PR N is
#           open; fork heads match no branch and are skipped).
#           "Tested" = listed in tested-shas.txt on the pandra-tested
#           branch of this repository (the marker ledger).
#   suite:  the full ci.yml suites (Linux + Windows) per untested SHA,
#           cloned by SHA over the deploy key.
#   mark:   after every suite job for the batch succeeds, append the
#           SHAs to the ledger (pushed with the job's GITHUB_TOKEN).
#
# Manual runs:
#   * workflow_dispatch with ref empty  -> normal auto-detect pass
#   * workflow_dispatch with ref <sha|branch> -> test exactly that ref
#     (it is NOT added to the ledger unless it was auto-picked too)
#   * repository_dispatch (event pandra-ci, client_payload.ref) -> same
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Pandra ref to test (SHA or branch; empty = auto-detect main + open PRs)"
        required: false
        default: ""
  repository_dispatch:
    types: [pandra-ci]

permissions:
  contents: write # push the pandra-tested marker ledger

concurrency:
  group: pandra-ci
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.pick.outputs.count }}
      shas: ${{ steps.pick.outputs.shas }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the marker ledger (pandra-tested branch)
        run: |
          if git fetch --depth 1 origin pandra-tested; then
            git checkout FETCH_HEAD -- tested-shas.txt || true
          else
            echo "(no pandra-tested branch yet — everything is untested)"
          fi

      - name: Set up SSH (read-only Pandra deploy key)
        env:
          PANDRA_DEPLOY_KEY: ${{ secrets.PANDRA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PANDRA_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pick untested SHAs
        id: pick
        env:
          MANUAL_REF: ${{ github.event.client_payload.ref || github.event.inputs.ref || '' }}
          PANDRA_GIT: git@github.com:imu31465/Pandra.git
        run: |
          if [ -n "$MANUAL_REF" ]; then
            # resolve any ref (SHA, branch or tag) by fetching it once
            tmp=$(mktemp -d)
            git -C "$tmp" init -q
            git -C "$tmp" fetch --depth 1 "$PANDRA_GIT" "$MANUAL_REF"
            sha=$(git -C "$tmp" rev-parse FETCH_HEAD)
            echo "manual ref $MANUAL_REF -> $sha"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "shas=[\"$sha\"]" >> "$GITHUB_OUTPUT"
            echo 'labels=["manual"]' >> "$GITHUB_OUTPUT"
            matrix=$(jq -cn --arg s "$sha" \
              '[{sha:$s,label:"manual",os:"ubuntu-latest",py:"python3"},
                {sha:$s,label:"manual",os:"windows-latest",py:"python"}]')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          else
            bash scripts/pandra_detect.sh
            # re-read what pandra_detect.sh just appended to $GITHUB_OUTPUT
            shas=$(grep '^shas=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
            labels=$(grep '^labels=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
            matrix=$(jq -cn --argjson s "$shas" --argjson l "$labels" \
              '[$s | to_entries[] as $e |
                 {sha:$e.value,label:$l[$e.key],os:"ubuntu-latest",py:"python3"},
                 {sha:$e.value,label:$l[$e.key],os:"windows-latest",py:"python"}]')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  suite:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PY: ${{ matrix.py }}
      SRC: src
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone Pandra at ${{ matrix.label }} ${{ matrix.sha }} (read-only deploy key)
        env:
          PANDRA_DEPLOY_KEY: ${{ secrets.PANDRA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PANDRA_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git init "$SRC"
          git -C "$SRC" fetch --depth 1 git@github.com:imu31465/Pandra.git "${{ matrix.sha }}"
          git -C "$SRC" checkout -q FETCH_HEAD
          git -C "$SRC" log -1 --oneline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Validate project registry and generated views
        working-directory: ${{ env.SRC }}
        run: |
          "$PY" scripts/project_registry.py
          git diff --exit-code -- docs/project
          "$PY" scripts/project_registry.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Restore tool/ dependencies (lockfile)
        working-directory: ${{ env.SRC }}/tool
        run: npm ci --no-fund --no-audit

      - name: Restore m0/tools dependencies (lockfile)
        working-directory: ${{ env.SRC }}/m0/tools
        run: npm ci --no-fund --no-audit

      - name: Provision CI-only python deps (brotli for size metrics)
        run: |
          "$PY" -m pip install --quiet 'brotli==1.1.0'
          "$PY" -c "import brotli; print('brotli ok')"

      - name: Record versions (after setup — what actually ran)
        working-directory: ${{ env.SRC }}
        run: |
          mkdir -p ci-artifacts
          {
            echo "runner: $(uname -sr) $(uname -m)"
            echo "pandra: ${{ matrix.label }} ${{ matrix.sha }}"
            echo "python: $("$PY" --version 2>&1)"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "lockfile-sha256: $(sha256sum m0/tools/package-lock.json | cut -d' ' -f1)"
          } | tee "ci-artifacts/versions-${{ matrix.os }}.txt"

      - name: Python syntax check
        working-directory: ${{ env.SRC }}
        run: $PY -m compileall -q tool m0/tools

      - name: Node syntax check (all mjs)
        working-directory: ${{ env.SRC }}
        run: |
          set -e
          find tool m0/harness scripts -name '*.mjs' -not -path '*/node_modules/*' -print0 |
            xargs -0 -n1 node --check

      - name: P0 mapping verification
        working-directory: ${{ env.SRC }}
        run: $PY m0/tools/verify_p0_mapping.py | tee "ci-artifacts/p0-mapping-${{ matrix.os }}.txt"

      - name: Differential harness selftest
        working-directory: ${{ env.SRC }}
        run: node tool/differential_harness.mjs selftest | tee "ci-artifacts/differential-selftest-${{ matrix.os }}.txt"

      - name: B-budget runner selftest
        working-directory: ${{ env.SRC }}
        run: $PY tool/b_budget_windows_runner.py --selftest | tee "ci-artifacts/budget-selftest-${{ matrix.os }}.txt"

      - name: Python unit suites (full discovery)
        working-directory: ${{ env.SRC }}
        run: $PY -m unittest discover -s tool/tests -v 2>&1 | tee "ci-artifacts/python-tests-${{ matrix.os }}.log"

      - name: Node unit suites (auto-discovered, every test_*.mjs)
        working-directory: ${{ env.SRC }}
        run: |
          set -e
          status=0
          for f in $(find tool/tests -name 'test_*.mjs' | sort); do
            echo "== node suite: $f"
            node "$f" 2>&1 | tee "ci-artifacts/$(basename "$f" .mjs)-${{ matrix.os }}.log" || status=1
          done
          exit $status

      - name: Windows C0 build smoke (lockfile restore, no registry fetch)
        if: matrix.os == 'windows-latest'
        working-directory: ${{ env.SRC }}
        run: |
          "$PY" -c "import sys; sys.path.insert(0, 'tool'); import importlib.util; spec = importlib.util.spec_from_file_location('c0', 'tool/c0_pipeline.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); import tempfile, pathlib; d = pathlib.Path(tempfile.mkdtemp()); body = d / 'b.js'; body.write_text('const add=(a,b)=>a+b; console.log(add(1,2));'); out = d / 'o.js'; r = m.esbuild_minify(body, out, mangling=True); print('exit', r['exit'], 'source', r['minifierSource']); sys.exit(0 if r['exit'] == 0 and 'lockfile-restore' in r['minifierSource'] else 1)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandra-ci-${{ matrix.label }}-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ env.SRC }}/ci-artifacts/
          retention-days: 14

  mark:
    needs: [detect, suite]
    if: needs.detect.outputs.count != '0' && needs.suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mark SHAs tested (push pandra-tested ledger)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readarray -t shas < <(jq -r '.[]' <<< '${{ needs.detect.outputs.shas }}')
          bash scripts/pandra_mark.sh "${shas[@]}"
