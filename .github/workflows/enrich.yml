name: enrich

on:
  schedule:
    # Daily: probe 429 storms are per-runner-IP luck, so a failed or
    # degraded run should retry on a fresh runner the next day instead of
    # waiting two days (public runners are free).
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      force_ids:
        description: >-
          Comma-separated player ids to social-fetch right now, bypassing
          the A-gate skip rules - e.g. 3734 for a rename the cursor has not
          wrapped around to yet. When set, only these ids are processed
          (the regular 25k drip is skipped) and the stored cursor is not
          moved.
        required: false
        default: ""

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone task sources (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          git -C src sparse-checkout set --no-cone '/tools/' '/app.py' '/requirements.txt' '/cosmetics_codec.py' '/cosmetics_dictionary.json'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Resolve live SP token (bloxd.io redeploy rotation)
        # Same rationale as sweep.yml: re-derive the anti-bot 3PSIDMCSP
        # statically from the live JS bundle (minifier-proof anchors) and
        # validate it by minting; the Playwright browser capture only runs
        # when that fails. app.py also derives on its own at import, so a
        # total failure here is survivable. head/tr keep $SP to one clean
        # 60-char line no matter what any library prints.
        continue-on-error: true
        working-directory: src
        run: |
          SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          if [ -z "$SP" ] || [ "${#SP}" -ne 60 ]; then
            echo "static path unusable; installing playwright for the browser fallback"
            pip install --quiet playwright
            SP=$(python tools/fetch_sp_token.py | head -n1 | tr -d '[:space:]') || SP=""
          fi
          if [ -n "$SP" ] && [ "${#SP}" -eq 60 ]; then
            echo "live SP token resolved (length ${#SP})"
            echo "::add-mask::$SP"
            echo "BLOXD_3PSIDMCSP=$SP" >> "$GITHUB_ENV"
          else
            echo "SP token resolution failed; app.py will derive live or use the committed fallback"
          fi

      - name: Drip refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: src
        run: |
          ARGS=(--limit 25000)
          # Manual dispatch: optionally force-fetch specific player ids
          # (rename hotfix). tr keeps digits and commas only, so a typo'd
          # or pasted input can never smuggle shell syntax in here.
          FORCE_IDS="$(printf '%s' "${{ inputs.force_ids }}" | tr -cd '0-9,')"
          if [ -n "$FORCE_IDS" ]; then
            echo "forced ids: $FORCE_IDS"
            ARGS+=(--force-ids "$FORCE_IDS")
          fi
          python tools/run_masked.py tools/enrich_profiles.py "${ARGS[@]}"

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ enrich job failed",
                "color": 15158332,
                "fields": [
                  {"name": "リポジトリ", "value": "'"${GITHUB_REPOSITORY}"'", "inline": true},
                  {"name": "実行ログ", "value": "[run #'"${GITHUB_RUN_NUMBER}"']('"$RUN_URL"')", "inline": true}
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            > /dev/null
