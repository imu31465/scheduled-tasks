name: enrich

on:
  schedule:
    # Daily: probe 429 storms are per-runner-IP luck, so a failed or
    # degraded run should retry on a fresh runner the next day instead of
    # waiting two days (public runners are free).
    - cron: "37 1 * * *"
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone task sources (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          git -C src sparse-checkout set --no-cone '/tools/' '/app.py' '/requirements.txt'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Extract live SP token (bloxd.io redeploy rotation)
        # Same rationale as sweep.yml: capture the current anti-bot
        # 3PSIDMCSP from one real page load; fall back to the committed
        # constant in app.py when the capture fails.
        continue-on-error: true
        working-directory: src
        run: |
          pip install --quiet playwright
          SP=$(python tools/fetch_sp_token.py) || SP=""
          if [ -n "$SP" ]; then
            echo "live SP token captured (length ${#SP})"
            echo "::add-mask::$SP"
            echo "BLOXD_3PSIDMCSP=$SP" >> "$GITHUB_ENV"
          else
            echo "SP token capture failed; using the committed fallback"
          fi

      - name: Drip refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: src
        run: python tools/run_masked.py tools/enrich_profiles.py --limit 25000

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ enrich job failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            > /dev/null
