name: sweep

on:
  schedule:
    # Every 30 minutes; each run drives five parallel shards (each on its own
    # runner IP) for ~25 minutes, so the fleet runs near-continuously.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soft time budget per shard in minutes (default 25)"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    concurrency:
      # One run per shard at a time; shards are independent id classes.
      group: sweep-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Clone task sources (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch runner --filter=blob:none --sparse \
            git@github.com:imu31465/bloxd-player-search.git src
          git -C src sparse-checkout set --no-cone '/tools/' '/app.py' '/requirements.txt'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Extract live SP token (bloxd.io redeploy rotation)
        # The anti-bot 3PSIDMCSP token rotates on bloxd.io client redeploys
        # (twice on 2026-10-27). Capture the current value from one real
        # page load so the shards survive rotations without a manual token
        # commit; on capture failure app.py falls back to its committed
        # constant. The token itself is never printed (length only).
        continue-on-error: true
        working-directory: src
        run: |
          pip install --quiet playwright
          SP=$(python tools/fetch_sp_token.py) || SP=""
          if [ -n "$SP" ]; then
            echo "live SP token captured (length ${#SP})"
            echo "::add-mask::$SP"
            echo "BLOXD_3PSIDMCSP=$SP" >> "$GITHUB_ENV"
          else
            echo "SP token capture failed; using the committed fallback"
          fi

      - name: Run shard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: src
        run: |
          MINS="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minutes || '25' }}"
          python tools/run_masked.py tools/social_sweep.py \
            --shard ${{ matrix.shard }}/5 --minutes "$MINS"

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ sweep shard ${{ matrix.shard }} failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            > /dev/null
